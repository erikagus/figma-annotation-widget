<!-- Hidden UI: widgets cannot touch the clipboard directly, so we copy from here. -->
<script>
  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text)
      return true
    } catch (e) {
      const el = document.createElement('textarea')
      el.value = text
      document.body.appendChild(el)
      el.focus()
      el.select()
      const ok = document.execCommand('copy')
      document.body.removeChild(el)
      return ok
    }
  }

  window.onmessage = async (event) => {
    const msg = event.data.pluginMessage
    if (!msg || msg.type !== 'copy') return
    const ok = await copy(msg.text)
    parent.postMessage({ pluginMessage: { type: 'copied', ok } }, '*')
  }

  // Tell the widget the page is loaded; messages sent earlier would be lost.
  parent.postMessage({ pluginMessage: { type: 'ready' } }, '*')
</script>
